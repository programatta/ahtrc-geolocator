services:
  ahtrc_service:
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    container_name: ahtrcservice_container
    ports:
      - "8000:8000"
    depends_on:
      postgres_service:
        condition: service_healthy
    env_file:
      - ./environment/.env-prod-ahtrc
    volumes:
      - static_data:/code/staticfiles
      - media_data:/code/media
    restart: always

  postgres_service:
    image: postgis/postgis:18-3.6-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./environment/.env-prod-db
    volumes:
      - ./docker/db:/var/lib/postgresql
      - ./docker/logs/postgres:/var/log/postgresql
    # $$POSTGRES_USER/$$POSTGRES_DB (escapados) para que los resuelva el
    # shell dentro del contenedor con las variables de .env-prod-db, no
    # Compose al parsear este fichero.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  http_service:
    image: nginx:1.30.4-trixie
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ahtrc_service
    # certbot (más abajo) renueva el certificado en su propio contenedor y no
    # puede avisar a este de forma directa sin acceso al socket de Docker
    # (equivale a root sobre el host, superficie que no queremos exponer).
    # En su lugar, recargamos nginx nosotros mismos cada 12h (mismo intervalo
    # que usa el bucle de certbot) para recoger el certificado renovado.
    # "nginx -s reload" es una recarga en caliente (relee certificados y
    # config, sin cortar conexiones); el margen de hasta 12h antes de
    # recogerlo es irrelevante para un certificado con ~90 días de validez.
    # El ENTRYPOINT de la imagen oficial solo ejecuta los scripts de
    # /docker-entrypoint.d/ (envsubst de ${DOMAIN} incluido) si "$1" es
    # literalmente "nginx"/"nginx-debug" (verificado leyendo su código); al
    # sobrescribir el CMD por defecto con este "/bin/sh" hay que lanzarlos
    # nosotros mismos antes de arrancar nginx, o la plantilla se queda sin
    # sustituir.
    command: >
      /bin/sh -c '
        for f in /docker-entrypoint.d/*.sh; do [ -x "$$f" ] && "$$f"; done;
        (while true; do sleep 12h; nginx -s reload; done) &
        exec nginx -g "daemon off;"
      '
    env_file:
      - ./environment/.env-prod-http
    volumes:
      - static_data:/code/staticfiles:ro
      - media_data:/code/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_html:/var/www/certbot:ro
      - ./nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/logs/http:/var/log/http
    restart: always

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_html:/var/www/certbot
    # Comando para validar el certificado y verificar la renovación cada 12 horas
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  static_data:
  media_data:
  certbot_etc:
  certbot_var:
  certbot_html:
